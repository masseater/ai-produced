name: update-branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/update-branches@dfa6379559a180aea5e527bc883c8972a1a85474

  ci-telemetry:
    needs: [update]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@dfa6379559a180aea5e527bc883c8972a1a85474
        with:
          github-token: ${{ github.token }}
