name: skills-lock

on:
  push:
    branches: ["renovate/**"]
    paths: [skills-lock.json]
  workflow_dispatch:
    inputs:
      branch:
        description: The renovate branch whose skills-lock.json to rehash
        required: true
        type: string

permissions: {}

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/skills-lock@03a7485dd2e6f73aa49aaa4926aba33b1f7f59b0
        with:
          branch: ${{ github.ref_name }}

  rehash:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: skills-lock-${{ inputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/skills-lock@03a7485dd2e6f73aa49aaa4926aba33b1f7f59b0
        with:
          branch: ${{ inputs.branch }}

  ci-telemetry:
    needs: [check, rehash]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@68becbb0934725055f1c657f1e77a529f0e3e338
        with:
          github-token: ${{ github.token }}
