name: skills-lock

on:
  push:
    branches: ["renovate/**"]
    paths: [skills-lock.json]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/skills-lock@0c9f2c316a486637e22878aea5e0a4a1a7f630c4
        with:
          github-token: ${{ github.token }}

  ci-telemetry:
    needs: [rehash]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@0c9f2c316a486637e22878aea5e0a4a1a7f630c4
        with:
          github-token: ${{ github.token }}
