[project]
name = "stem-repro"
version = "0.0.0"
description = "Reproduce a reference song from its published stems and MIDI, and measure how each stem and the mix differ"
requires-python = ">=3.11,<3.14"
dependencies = [
  "librosa>=0.11",
  "mido>=1.3",
  "numpy>=2",
  "pedalboard>=0.9.26",
  "pyloudnorm>=0.1.1",
  "scipy>=1.14",
  "soundfile>=0.13",
]

[tool.uv]
package = false
