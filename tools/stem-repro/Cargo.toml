[package]
name = "stem-repro"
description = "Reproduce a reference song from its published stems and MIDI with Surge XT, and measure how each stem and the mix differ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
ar = "0.9.0"
audio = { path = "../audio" }
basin = "3.3.0"
clack-extensions = { version = "0.2.0", features = ["clack-host", "params", "state"] }
clack-host = "0.2.0"
clap = { version = "4.6.7", features = ["derive"] }
ebur128 = "0.1.11"
hound = "3.5.1"
indexmap = { version = "2.14.2", features = ["serde"] }
liblzma = "0.4.9"
midly = "0.5.3"
ndarray = "0.17.2"
num-complex = "0.4.6"
num-traits = "0.2.19"
rand = "0.10.4"
rand_distr = "0.6.0"
realfft = "3.5.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sonara = { git = "https://github.com/kkollsga/sonara", rev = "15fb81d34e4e6ca856508e5520a84b1a4ab42b6e", version = "0.3.6" }
tar = "0.4.46"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
