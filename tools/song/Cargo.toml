[package]
name = "song"
description = "Song pipeline tools: score to MIDI, lyric timing, mora table, USTX and REAPER project builders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mora-check"
path = "src/app/mora_check.rs"

[[bin]]
name = "lyric-timing"
path = "src/app/lyric_timing.rs"

[[bin]]
name = "midi-rpp"
path = "src/app/midi_rpp.rs"

[[bin]]
name = "score-midi"
path = "src/app/score_midi.rs"

[[bin]]
name = "ustx-from-vocal"
path = "src/app/ustx_from_vocal.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
midly = "0.5.3"
num-traits = "0.2.19"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
uuid = { version = "1.29.2", features = ["v5"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
