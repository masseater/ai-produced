[package]
name = "transcribe"
description = "Transcribe a stem or a mix to MIDI with MuScriptor or Basic Pitch, and score a transcription against a reference MIDI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
audio = { path = "../audio" }
basic-pitch-rs = "0.2.0"
clap = { version = "4.6.7", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }
midly = "0.5.3"
num-traits = "0.2.19"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tract-onnx = "0.23.10"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"

[lints]
workspace = true
