[project]
name = "audio-to-midi"
version = "0.0.0"
description = "Transcribe a stem or a mix to MIDI with Basic Pitch or YourMT3+, and score a transcription against a reference MIDI"
requires-python = ">=3.14,<3.15"
dependencies = [
  "basic-pitch==0.4.0",
  "setuptools<85",
  "torch==2.4.1",
  "torchaudio==2.4.1",
  "lightning>=2.2.1",
  "transformers==4.57.6",
  "einops",
  "deprecated",
  "huggingface-hub",
  "librosa",
  "numpy==2.5.4",
  "pretty-midi",
  "mir-eval",
  "wandb>=0.28.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
