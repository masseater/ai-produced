[workspace]
resolver = "3"
members = ["tools/*"]
exclude = ["tools/openutau-render"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
