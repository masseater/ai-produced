[workspace]
resolver = "3"
members = ["tools/*"]
exclude = [
  "tools/openutau-render",
  "tools/audio-to-midi",
  "tools/mix-metrics",
  "tools/stem-repro",
  "tools/tempo-octave",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
